[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "matvix"
version = "2.0.0"
description = "Transparent, point-in-time VIX market narrative and calibrated transition probability engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Proprietary research delivery"}
authors = [{name = "MatVIX Engineering"}]
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scipy==1.17.0",
  "scikit-learn==1.7.2",
  "pyarrow==25.0.0",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "typer==0.26.3",
  "exchange-calendars==4.13.1",
  "plotly==6.5.2",
  "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.13.3",
  "mypy==1.18.2",
]

[project.scripts]
matvix = "matvix.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["matvix*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["matvix"]

[[tool.mypy.overrides]]
module = [
  "exchange_calendars",
  "jsonschema",
  "jsonschema.*",
  "pandas",
  "pandas.*",
  "plotly",
  "plotly.*",
  "requests",
  "scipy",
  "scipy.*",
  "sklearn",
  "sklearn.*",
  "yaml",
]
ignore_missing_imports = true
