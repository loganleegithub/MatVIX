version: "3.0.0"
event_order:
  - acute_front_stress_5d
  - front_inversion_5d
  - mid_curve_pressure_accelerates_5d
  - broad_stress_persists_10d
  - carry_environment_recovers_10d
event_policy:
  acute_front_stress_5d: FEATURE_CONDITIONAL_REQUIRED
  front_inversion_5d: FEATURE_CONDITIONAL_REQUIRED
  mid_curve_pressure_accelerates_5d: FEATURE_CONDITIONAL_REQUIRED
  broad_stress_persists_10d: BASE_RATE_ONLY_EXEMPT
  carry_environment_recovers_10d: FEATURE_CONDITIONAL_REQUIRED
event_predictors:
  acute_front_stress_5d:
    - carry_risk_scaled
    - shock_scaled
    - tail_price_scaled
    - persistence_scaled
    - score_change5_scaled
    - front_confirmation_scaled
  front_inversion_5d:
    - p_neg_front_slope30
    - p_neg_d5_front_slope30
    - p_neg_basis30_eod
    - shock_scaled
  mid_curve_pressure_accelerates_5d:
    - p_f4_f7_level
    - p_d5_log_f4_f7_level
    - p_neg_d5_f4_f7_slope30
    - f4_f7_inversion_share
    - shock_scaled
    - score_change5_scaled
  broad_stress_persists_10d: []
  carry_environment_recovers_10d:
    - repair_scaled
    - p_d5_front_slope30
    - p_neg_d5_near_stress
    - p_d5_f4_f7_slope30
    - p_neg_d5_log_f4_f7_level
    - shock_scaled
    - bounded_log1p_carry_spell_age
    - carry_recovering_flag
carry_duration:
  spell_age_cap: 20
base_rate:
  max_samples: 756
  minimum_samples: 252
  alpha: 1.0
  beta: 1.0
logistic:
  implementation: scikit-learn==1.7.2
  C: 1.0
  solver: lbfgs
  fit_intercept: true
  dual: false
  class_weight: null
  warm_start: false
  tol: 1.0e-8
  max_iter: 1500
  random_state: 0
  max_training_samples: 1500
  min_training_samples: 252
  min_positive: 30
  min_negative: 30
  purge_sessions: 20
rolling_intercept:
  implementation: scipy.optimize.brentq
  max_samples: 252
  min_positive: 20
  min_negative: 20
  slope: 1.0
  root_lower: -40.0
  root_upper: 40.0
  clip_min: 1.0e-6
  clip_max: 0.999999
acceptance:
  samples: 252
  min_positive: 20
  min_negative: 20
  brier_skill_min: 0.02
  ece_max: 0.07
  ece_bins: [51, 51, 50, 50, 50]
